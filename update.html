<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提出ノートを更新</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f7f2;color:#273b39;margin:0;padding:24px}main{max-width:560px;margin:40px auto;background:white;border-radius:20px;padding:28px}h1{font-size:24px}p{line-height:1.9}button{font:inherit;background:#247566;color:white;padding:16px;border:0;border-radius:12px;width:100%;cursor:pointer}button:disabled{opacity:.5}#status{min-height:40px}</style></head>
<body><main><h1>提出ノートを更新</h1><p>保存済みの提出記録を残したまま、画面のプログラムを最新版に切り替えます。</p><p>入力中の記録があれば、先にアプリで保存してください。ほかの提出ノートのタブは閉じて、この画面だけを残してください。</p><button id="update">保存を確認したので、最新版を開く</button><p id="status" role="status" aria-live="polite"></p><a href="./">更新せずアプリに戻る</a></main>
<script>
'use strict';
const button=document.querySelector('#update');
const status=document.querySelector('#status');
function waitForInstallation(registration) {
  if(registration.waiting)return Promise.resolve(registration.waiting);
  const worker=registration.installing;
  if(!worker)return Promise.resolve(null);
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{worker.removeEventListener('statechange',changed);reject(new Error('更新に時間がかかっています。通信を確認してもう一度お試しください。'));},30000);
    function changed(){
      if(worker.state==='installed'||worker.state==='activated'){clearTimeout(timer);worker.removeEventListener('statechange',changed);resolve(registration.waiting||worker);}
      else if(worker.state==='redundant'){clearTimeout(timer);worker.removeEventListener('statechange',changed);reject(new Error('新しい画面を取得できませんでした。もう一度お試しください。'));}
    }
    worker.addEventListener('statechange',changed);changed();
  });
}
button.onclick=async()=>{
  button.disabled=true;status.textContent='新しい画面を取得しています…';
  try{
    if(!('serviceWorker' in navigator)) {location.replace('./');return;}
    const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
    await registration.update();
    const waiting=await waitForInstallation(registration);
    if(waiting&&waiting.state!=='activated'){
      await new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>{waiting.removeEventListener('statechange',changed);reject(new Error('切り替えが完了しませんでした。ほかのアプリのタブを閉じて、もう一度押してください。'));},30000);
        function changed(){if(waiting.state==='activated'){clearTimeout(timer);waiting.removeEventListener('statechange',changed);resolve();}}
        waiting.addEventListener('statechange',changed);
        waiting.postMessage({type:'ACTIVATE_UPDATE'});changed();
      });
    }
    status.textContent='更新しました。アプリを開きます。';location.replace('./');
  }catch(error){status.textContent=error.message||'更新できませんでした。通信を確認してください。';button.disabled=false;}
};
</script></body></html>
