name: Publish homework app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - style.css
      - app.js
      - sw.js
      - manifest.webmanifest
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homework-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare only public application files
        run: |
          mkdir -p "$RUNNER_TEMP/homework-site"
          cp index.html style.css app.js sw.js manifest.webmanifest "$RUNNER_TEMP/homework-site/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/homework-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
